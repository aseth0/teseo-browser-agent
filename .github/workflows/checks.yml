# The checks every build goes through: typecheck, lint, tests and security checks (scripts/security.sh). Not run on
# its own: build.yml (each push) and release.yml (each version tag) call it. One job, one install: split into
# parallel jobs, each would install again for about a minute saved. Travels to the public repository with
# release.yml (scripts/publish-public.sh keeps it).
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm security
